services:
  postgres:
    image: postgres:16-alpine
    container_name: n8n-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n} -d ${POSTGRES_DB:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      # --- Database ---
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}

      # --- Host / URLs ---
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}

      # --- Timezone ---
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
      TZ: ${GENERIC_TIMEZONE:-UTC}

      # --- Security ---
      # Keep this key forever: it decrypts your stored credentials.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_SECURE_COOKIE: "${N8N_SECURE_COOKIE:-false}"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "${N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS:-true}"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "${N8N_BLOCK_ENV_ACCESS_IN_NODE:-true}"

      # --- Task runners (always on in n8n 2.x; these pin defaults that are due to change) ---
      N8N_RUNNERS_TASK_TIMEOUT: "${N8N_RUNNERS_TASK_TIMEOUT:-300}"
      OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "${OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS:-true}"
      N8N_GIT_NODE_DISABLE_BARE_REPOS: "${N8N_GIT_NODE_DISABLE_BARE_REPOS:-true}"
      N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: "${N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES:-2147483648}"
      N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: "${N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES:-5000}"

      # --- Housekeeping: don't let executions grow forever ---
      EXECUTIONS_DATA_PRUNE: "${EXECUTIONS_DATA_PRUNE:-true}"
      EXECUTIONS_DATA_MAX_AGE: "${EXECUTIONS_DATA_MAX_AGE:-336}"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: "${EXECUTIONS_DATA_SAVE_ON_SUCCESS:-all}"
      EXECUTIONS_DATA_SAVE_ON_ERROR: "${EXECUTIONS_DATA_SAVE_ON_ERROR:-all}"
      N8N_DIAGNOSTICS_ENABLED: "${N8N_DIAGNOSTICS_ENABLED:-false}"

      # --- Community nodes installable from the UI ---
      N8N_COMMUNITY_PACKAGES_ENABLED: "${N8N_COMMUNITY_PACKAGES_ENABLED:-true}"
      N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE: "${N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE:-true}"
      N8N_UNVERIFIED_PACKAGES_ENABLED: "${N8N_UNVERIFIED_PACKAGES_ENABLED:-true}"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./local-files:/files
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  n8n_data:
  postgres_data:
